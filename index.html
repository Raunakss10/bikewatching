<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bikewatching</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

  <!-- Mapbox GL JS CSS -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">

  <link rel="stylesheet" href="global.css">
  <link rel="stylesheet" href="map.css">
  <script src="map.js" type="module"></script>
</head>
<body>
  <header>
    <div class="title">
      <h1>🚴🏼‍♀️ Bikewatching</h1>
      <p class="subtitle">Bluebikes traffic across Boston and Cambridge, March 2024. Circle size shows how many trips start or end at a station.</p>
    </div>

    <label class="time-filter">
      Filter by time:
      <input id="time-slider" type="range" min="-1" max="1440" value="-1" aria-describedby="time-help">
      <time id="selected-time"></time>
      <em id="any-time">(any time)</em>
      <small id="time-help">Trips within 1 hour of the selected time</small>
    </label>
  </header>

  <div id="map">
    <svg aria-hidden="true"></svg>
    <p id="status" role="status">Loading map…</p>
  </div>

  <div class="legend" aria-label="Legend">
    <span class="legend-label">Legend:</span>
    <div style="--departure-ratio: 1">More departures</div>
    <div style="--departure-ratio: 0.5">Balanced</div>
    <div style="--departure-ratio: 0">More arrivals</div>
  </div>
</body>
</html>
